spring:
  application:
    name: careflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careflow}
    username: ${DB_USERNAME:careflow}
    password: ${DB_PASSWORD:careflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

careflow:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

